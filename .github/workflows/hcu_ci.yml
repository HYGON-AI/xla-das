# Before first use, set the repository variables referenced below:
#   HCU_CI_IMAGE        e.g. harbor.internal/das/xla-ci
#   HCU_CI_DIGEST       e.g. sha256:abc123...   (pin by digest, not by tag)
#   HCU_PYTHON_VERSION  e.g. 3.12
#   JAX_DAS_REPO        e.g. HYGON-AI/jax-das
#   JAX_DAS_REF         e.g. 0.10.0-das

name: CI HCU
permissions:
  contents: read
on:
  pull_request:
  push:
    branches:
      - jax/0.10.0-das
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/jax/0.10.0-das' }}

jobs:
  hcu-config:
    runs-on: ubuntu-latest
    outputs:
      docker-image: ${{ steps.out.outputs.docker-image }}
    steps:
      - id: out
        shell: bash
        env:
          HCU_CI_IMAGE: ${{ vars.HCU_CI_IMAGE }}
          HCU_CI_DIGEST: ${{ vars.HCU_CI_DIGEST }}
        run: |
          set -euo pipefail
          if [[ -z "${HCU_CI_IMAGE}" || -z "${HCU_CI_DIGEST}" ]]; then
            echo "::error::Repository variables HCU_CI_IMAGE and HCU_CI_DIGEST must be set." >&2
            exit 1
          fi
          echo "docker-image=${HCU_CI_IMAGE}@${HCU_CI_DIGEST}" >> "$GITHUB_OUTPUT"

  xla:
    needs: hcu-config
    name: XLA Linux x86 HCU
    runs-on: linux-x86-64-4gpu-hcu
    env:
      DOCKER_IMAGE: ${{ needs.hcu-config.outputs.docker-image }}
    container: &hcu_container
      image: ${{ needs.hcu-config.outputs.docker-image }}
      volumes:
        - /opt/hyhal:/opt/hyhal:ro
      options: >-
        --device=/dev/kfd
        --device=/dev/mkfd
        --device=/dev/dri
        --ipc=host
        --shm-size=64G
        --cap-add=SYS_PTRACE
        --security-opt=seccomp=unconfined
        --tmpfs /root/.cache/bazel:rw,exec,size=80g
        --group-add video
    defaults:
      run:
        shell: bash
    steps:
      - name: Checking out xla-das
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: CPU Info
        run: lscpu

      - name: HCU info
        run: |
          source /opt/dtk/env.sh
          "${ROCM_PATH:-/opt/dtk}/bin/rocminfo"
          "${ROCM_PATH:-/opt/dtk}/bin/rocm_agent_enumerator"

      - name: Test XLA [single_gpu]
        timeout-minutes: 360
        run: |
          source /opt/dtk/env.sh
          bash build_tools/hcu/run_xla_ci_build.sh \
            --config=hcu \
            --config=ci_single_gpu \
            --config=hcu_sgpu \
            --local_test_jobs=4

      - name: Test XLA [multi_gpu]
        timeout-minutes: 360
        run: |
          source /opt/dtk/env.sh
          bash build_tools/hcu/run_xla_ci_build.sh \
            --config=hcu \
            --config=ci_multi_gpu \
            --config=hcu_mgpu \
            --local_test_jobs=1

      - name: Upload XLA test artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xla-hcu-test-artifacts-${{ github.run_id }}
          path: ci_artifacts/
          retention-days: 7

  jax:
    needs: hcu-config
    if: ${{ github.event_name != 'pull_request' || github.base_ref == 'main' || github.base_ref == 'dev' }}
    name: JAX Linux x86 HCU
    runs-on: linux-x86-64-1gpu-hcu
    env:
      DOCKER_IMAGE: ${{ needs.hcu-config.outputs.docker-image }}
    container: *hcu_container
    defaults:
      run:
        shell: bash
    steps:
      - name: Checking out xla-das
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: xla-das
          persist-credentials: false

      - name: Checkout jax-das
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ vars.JAX_DAS_REPO || 'HYGON-AI/jax-das' }}
          ref: ${{ vars.JAX_DAS_REF || 'main' }}
          path: jax-das
          persist-credentials: false

      - name: CPU Info
        run: lscpu

      - name: HCU info
        run: |
          source /opt/dtk/env.sh
          "${ROCM_PATH:-/opt/dtk}/bin/rocminfo"
          "${ROCM_PATH:-/opt/dtk}/bin/rocm_agent_enumerator"

      - name: Stage HCU bazel test script into jax-das
        run: |
          cp xla-das/build_tools/hcu/run_jax_bazel_test.sh jax-das/ci/
      - name: Test JAX [single_gpu]
        timeout-minutes: 360
        working-directory: jax-das
        env:
          JAXCI_XLA_GIT_DIR: ${{ github.workspace }}/xla-das
          JAXCI_HERMETIC_PYTHON_VERSION: ${{ vars.HCU_PYTHON_VERSION || '3.12' }}
        run: |
          source /opt/dtk/env.sh
          bash ci/run_jax_bazel_test.sh \
            --single_gpu \
            --//jax:build_jaxlib=wheel \
            --//jax:build_jax=true \
            --action_env=JAX_ENABLE_X64=1

      - name: Upload JAX test artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jax-hcu-bazel-artifacts-${{ github.run_id }}
          path: jax-das/test-artifacts/
          retention-days: 7
